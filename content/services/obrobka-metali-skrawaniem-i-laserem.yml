label: Obróbka metali
intro:
  - Maszyny CNC (Computer Numerical Control) umożliwiły przełom w produkcji przemysłowej dzięki automatyzacji i precyzji obróbki skrawaniem.
  - "Firma Termospec świadczy następujące usługi w tym zakresie:"
sections:
  - points:
      - frezowanie – proces usuwania materiału za pomocą obrotowego narzędzia – frezu
      - cięcie – oddzielanie części materiału od całości przy użyciu pił, laserów lub plazmy
      - toczenie – obróbka materiału obracającego się wokół własnej osi, podczas gdy narzędzie skrawające usuwa jego nadmiar
      - szlifowanie – proces ścierania materiału za pomocą narzędzia szlifierskiego
      - wiercenie – tworzenie otworów w materiale przy użyciu specjalnych wierteł
machines:
  - title: Pionowe centrum obróbcze Mazak VTC 820/20
    description: To pionowe centrum obróbcze zostało zaprojektowane do wszechstronnych zastosowań w obróbce skrawaniem. Maszyna charakteryzuje się dużym zakresem ruchu we wszystkich trzech osiach oraz elastycznością i wysoką precyzją.
    specifications:
      - label: przesuw w osi X
        value: 2000 mm
      - label: przesuw w osi Y
        value: 820 mm
      - label: przesuw w osi Z
        value: 720 mm
      - label: długość stołu
        value: 2500 mm
      - label: szerokość stołu
        value: 820 mm
      - label: maks. obroty wrzeciona
        value: 12 000 rpm
      - label: moc silnika wrzeciona
        value: 22 kW
  - title: Tokarka CNC SMEC SL 2000M
    description: To zaawansowana maszyna do obróbki skrawaniem, wyposażona w funkcje toczenia oraz frezowania dzięki zastosowaniu narzędzi obrotowych. Jest to model z serii SL 2000, produkowany przez firmę SMEC (Samsung Machine Tools Engineering Company).
    specifications:
      - label: maks. średnica nad łożem
        value: 570 mm
      - label: maks. średnica toczenia
        value: 360 mm
      - label: maks. długość toczenia
        value: 520 mm
      - label: maks. średnica obróbki z pręta
        value: 68 mm
      - label: prędkość obrotowa
        value: 4500 rpm
      - label: chwyt wrzeciona
        value: A 2-6"
      - label: prześwit wrzeciona
        value: 76 mm
      - label: średnica uchwytu 3-szczękowego
