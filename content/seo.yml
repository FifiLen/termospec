stronaGlowna:
  tytul: Termospec — systemy chłodzenia i wentylacji dla przemysłu
  opis: Projektowanie, produkcja i serwis rozwiązań chłodniczych oraz wentylacyjnych dla przemysłu, górnictwa i infrastruktury technicznej.
oFirmie:
  tytul: O firmie
  opis: Termospec zapewnia kompleksową realizację i obsługę instalacji klimatyzacyjnych oraz wentylacyjnych o dużych mocach.
uslugi:
  tytul: Usługi
  opis: "Zakres usług Termospec: projektowanie systemów klimatyzacji i wentylacji, serwis 24/7, remonty urządzeń chłodniczych, obróbka metali oraz konstrukcje stalowe."
produkty:
  tytul: Produkty
  opis: "Katalog produktów Termospec: agregaty chłodnicze, chłodnice powietrza, parowniki, chłodnice wyparne, systemy redukcji ciśnienia, zbiorniki, sterowanie i wentylatory."
