hero:
  slides:
    - title: |-
        Systemy dla górnictwa
        i przemysłu.
      lead: Projektujemy i produkujemy rozwiązania techniczne przeznaczone do pracy w wymagających warunkach podziemnych.
      presentation: nakladka
      image:
        alt: Urządzenia chłodnicze i wentylacyjne Termospec w wyrobisku podziemnym
        desktop:
          src: /images/hero/hero-gornictwo-przemysl.jpg
          position: center center
        mobile:
          src: /images/hero/hero-gornictwo-przemysl.jpg
          position: right center
      caption:
        label: ""
        text: górnictwo / przemysł
      facts:
        - value: blisko 30 lat
          label: doświadczenia
        - value: 500 MW
          label: łącznej mocy chłodniczej
        - value: kopalnie / tunele
          label: obszary zastosowań
      primaryLink:
        label: zobacz produkty
        href: /produkty
      secondaryLink:
        label: zobacz realizacje
        href: "#realizacje"
    - title: |-
        Kontrola warunków
        pracy pod ziemią.
      lead: Projektujemy i obsługujemy układy klimatyzacji centralnej kopalń oraz systemy redukcji ciśnienia wody.
      presentation: nakladka
      image:
        alt: Rurociągi instalacji klimatyzacji centralnej w wyrobisku podziemnym
        desktop:
          src: /images/hero/hero-kontrola-warunkow.jpg
          position: center center
        mobile:
          src: /images/hero/hero-kontrola-warunkow.jpg
          position: center center
      caption:
        label: ""
        text: górnictwo
      facts:
        - value: blisko 30 lat
          label: doświadczenia
        - value: 500 MW
          label: łącznej mocy chłodniczej
        - value: kopalnie / tunele
          label: obszary zastosowań
      primaryLink:
        label: zobacz produkty
        href: /produkty
      secondaryLink:
        label: zobacz realizacje
        href: "#realizacje"
    - title: |-
        Profesjonalna
        obróbka stali.
      lead: Oferujemy obróbkę skrawaniem, wycinanie i wykrawanie laserowe. Nasz doświadczony zespół i nowoczesne rozwiązania to gwarancja jakości i terminowości realizacji.
      presentation: nakladka
      image:
        alt: Obróbka skrawaniem stali na frezarce CNC w zakładzie Termospec
        desktop:
          src: /images/hero/hero-obrobka-stali.jpg
          position: center center
        mobile:
          src: /images/hero/hero-obrobka-stali.jpg
          position: center center
      caption:
        label: ""
        text: górnictwo / przemysł
      facts:
        - value: Precyzja
          label: dokładność do 0,1 mm
        - value: Nowoczesny park maszynowy
          label: Zaawansowane maszyny, innowacyjne rozwiązania
      primaryLink:
        label: zobacz ofertę
        href: /uslugi
      secondaryLink:
        label: zobacz realizacje
        href: "#realizacje"
    - title: Od projektu do utrzymania instalacji.
      lead: Łączymy zaplecze projektowe, produkcję urządzeń, uruchomienia oraz obsługę serwisową rozwiązań przemysłowych.
      presentation: nakladka
      image:
        alt: Model techniczny agregatu chłodniczego Termospec przechodzący w gotowe urządzenie
        desktop:
          src: /images/hero/hero-od-projektu.jpg
          position: center center
        mobile:
          src: /images/hero/hero-od-projektu.jpg
          position: right center
      caption:
        label: ""
        text: projektowanie / produkcja / serwis
      facts:
