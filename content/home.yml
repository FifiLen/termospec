hero:
  slides:
    - title: |-
        Systemy dla górnictwa
        i przemysłu.
      lead: Projektujemy i produkujemy rozwiązania techniczne przeznaczone do pracy w wymagających warunkach podziemnych.
      presentation: nakladka
      image:
        alt: Urządzenia chłodnicze i wentylacyjne Termospec w wyrobisku podziemnym
        desktop:
          src: /images/hero/hero-gornictwo-przemysl.jpg
          position: center center
        mobile:
          src: /images/hero/hero-gornictwo-przemysl.jpg
          position: right center
      caption:
        label: ""
        text: górnictwo / przemysł
      facts:
        - value: blisko 30 lat
          label: doświadczenia
        - value: 500 MW
          label: łącznej mocy chłodniczej
        - value: kopalnie / tunele
          label: obszary zastosowań
      primaryLink:
        label: zobacz produkty
        href: /produkty
      secondaryLink:
        label: zobacz realizacje
        href: "#realizacje"
    - title: |-
        Kontrola warunków
        pracy pod ziemią.
      lead: Projektujemy i obsługujemy układy klimatyzacji centralnej kopalń oraz systemy redukcji ciśnienia wody.
      presentation: nakladka
      image:
        alt: Rurociągi instalacji klimatyzacji centralnej w wyrobisku podziemnym
        desktop:
          src: /images/hero/hero-kontrola-warunkow.jpg
          position: center center
        mobile:
          src: /images/hero/hero-kontrola-warunkow.jpg
          position: center center
      caption:
        label: ""
        text: górnictwo
      facts:
        - value: blisko 30 lat
          label: doświadczenia
        - value: 500 MW
          label: łącznej mocy chłodniczej
        - value: kopalnie / tunele
          label: obszary zastosowań
      primaryLink:
        label: zobacz produkty
        href: /produkty
      secondaryLink:
        label: zobacz realizacje
        href: "#realizacje"
    - title: |-
        Profesjonalna
        obróbka stali.
      lead: Oferujemy obróbkę skrawaniem, wycinanie i wykrawanie laserowe. Nasz doświadczony zespół i nowoczesne rozwiązania to gwarancja jakości i terminowości realizacji.
      presentation: nakladka
      image:
        alt: Obróbka skrawaniem stali na frezarce CNC w zakładzie Termospec
        desktop:
          src: /images/hero/hero-obrobka-stali.jpg
          position: center center
        mobile:
          src: /images/hero/hero-obrobka-stali.jpg
          position: center center
      caption:
        label: ""
        text: górnictwo / przemysł
      facts:
        - value: Precyzja
          label: dokładność do 0,1 mm
        - value: Nowoczesny park maszynowy
          label: Zaawansowane maszyny, innowacyjne rozwiązania
      primaryLink:
        label: zobacz ofertę
        href: /uslugi
      secondaryLink:
        label: zobacz realizacje
        href: "#realizacje"
    - title: Od projektu do utrzymania instalacji.
      lead: Łączymy zaplecze projektowe, produkcję urządzeń, uruchomienia oraz obsługę serwisową rozwiązań przemysłowych.
      presentation: nakladka
      image:
        alt: Model techniczny agregatu chłodniczego Termospec przechodzący w gotowe urządzenie
        desktop:
          src: /images/hero/hero-od-projektu.jpg
          position: center center
        mobile:
          src: /images/hero/hero-od-projektu.jpg
          position: right center
      caption:
        label: ""
        text: projektowanie / produkcja / serwis
      facts:
        - value: blisko 30 lat
          label: doświadczenia
        - value: 500 MW
          label: łącznej mocy chłodniczej
        - value: kopalnie / tunele
          label: obszary zastosowań
      primaryLink:
        label: zobacz produkty
        href: /produkty
      secondaryLink:
        label: zobacz realizacje
        href: "#realizacje"
scope:
  image:
    src: /images/home/zakres-siedziba-termospec.webp
    alt: Siedziba i zakład produkcyjny Termospec w Żorach
  items:
    - title: Klimatyzacja
      lead: |-
        Produkcja urządzeń chłodniczych dla kopalń podziemnych oraz tuneli.
        Projektowanie, obsługa oraz serwis układów klimatyzacji kopalń.
      points:
        - układy klimatyzacji kopalń
        - urządzenia chłodnicze
        - dobór parametrów pracy
        - serwis i modernizacja instalacji
      icon: /images/home/ikona-klimatyzacja.png
      action:
        label: zobacz produkty
        href: /produkty
    - title: Wentylacja
      lead: Produkcja i serwis wentylatorów oraz tam wentylacyjnych dla kopalń.
      points:
        - wentylatory przemysłowe
        - tamy wentylacyjne
        - obsługa eksploatacyjna
        - utrzymanie przepływu powietrza
      icon: /images/home/ikona-wentylacja.png
      action:
        label: zobacz produkty
        href: /produkty
    - title: Energia odnawialna
      lead: Projektowanie, montaż, serwis oraz obsługa systemów opartych na odnawialnych źródłach energii.
      points:
        - dobór rozwiązań OZE
        - montaż instalacji
        - obsługa techniczna
        - serwis i utrzymanie
      icon: /images/home/ikona-odnawialna.png
      action:
        label: zobacz usługi
        href: /uslugi
contact:
  topics:
    - Klimatyzacja / chłodzenie
    - Wentylacja
    - Serwis lub modernizacja
    - Energia odnawialna
    - Inny zakres techniczny
