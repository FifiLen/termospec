  - title: Zasada działania
    body: Parownik jest wykorzystywany do bezpośredniego chłodzenia powietrza jako chłodnica powietrza. Przepływające przez parownik powietrze o temperaturze powyżej 26 °C chłodzone jest o 10–14 °C.
